# Ubuntu 22.04 stores MinGW's POSIX C++ headers outside Clang 14's search path.
# Used after cross-clang-mingw64.ini, leaving the existing target unchanged.
[built-in options]
cpp_args = [
  '--target=x86_64-w64-windows-gnu',
  # Match Jammy's GCC/MinGW static runtime TLS model. Native Clang TLS faults
  # when the exception guard reads its thread-local state on Windows.
  '-femulated-tls',
  '-isystem', '/usr/lib/gcc/x86_64-w64-mingw32/10-posix/include/c++',
  '-isystem', '/usr/lib/gcc/x86_64-w64-mingw32/10-posix/include/c++/x86_64-w64-mingw32',
  '-isystem', '/usr/lib/gcc/x86_64-w64-mingw32/10-posix/include/c++/backward',
  ]
cpp_link_args = [
  '--target=x86_64-w64-windows-gnu', '-static',
  '-L/usr/lib/gcc/x86_64-w64-mingw32/10-posix',
  ]
